<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plans | Cloud Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #f7c66a, transparent 60%),
        radial-gradient(circle at top right, #f3a6c8, transparent 60%),
        radial-gradient(circle at bottom left, #b8b3f0, transparent 60%),
        radial-gradient(circle at bottom right, #f4b183, transparent 60%);
      color: #111;
    }

    /* ===== NAVBAR (SAME AS FEATURES) ===== */
    .navbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: 20px 60px;
    }

    .logo a {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.6px;
      text-decoration: none;
      color: #000;
    }

    .navbar nav {
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    .navbar nav a {
      text-decoration: none;
      color: #222;
      font-weight: 500;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
    }

    .nav-buttons a {
      padding: 10px 18px;
      text-decoration: none;
      font-size: 14px;
      border-radius: 999px;
    }

    .btn-outline {
      border: 1px solid #000;
      color: #000;
    }

    .btn-solid {
      background: #000;
      color: #fff;
    }

    /* ===== HEADER ===== */
    .page-header {
      text-align: center;
      padding: 100px 20px 60px;
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 56px;
      margin-bottom: 12px;
    }

    .page-header p {
      font-size: 18px;
      color: #444;
    }

    /* ===== PLAN SECTION ===== */
    .plan-section {
      display: flex;
      justify-content: center;
      padding: 40px 20px 80px;
    }

    .plan-card {
      background: #fff;
      max-width: 360px;
      width: 100%;
      padding: 40px;
      text-align: center;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    }

    .plan-card h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .price span {
      font-size: 16px;
      color: #666;
    }

    .plan-card ul {
      list-style: none;
      margin: 30px 0;
      text-align: left;
    }

    .plan-card ul li {
      margin-bottom: 12px;
      font-size: 15px;
    }

    .plan-card button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: #000;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .plan-card button:hover {
      background: #222;
    }

    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      padding: 30px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

      <a href="about.html">About</a>
    </nav>

    <div class="nav-buttons">
      <a href="login.html" class="btn-outline">Login</a>
      <a href="login.html" class="btn-solid">Get started free</a>
    </div>
  </header>

  <!-- HEADER -->
  <section class="page-header">

    <p>Simple and free for all students</p>
  </section>
